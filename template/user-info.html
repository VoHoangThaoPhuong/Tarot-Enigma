<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tarot Enigma</title>
    <!--General-->
    <link rel="stylesheet" href="../assets/css/style.css" />
    <!--LienHe-->
    <link rel="stylesheet" href="../assets/css/user-info.css" />
    <!--Boostrap-->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    /> 
    <!--Fontawsome-->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />
    <!--Favicon-->
    <link rel="icon" href="../assets/images/Giới thiệu/favicon-01.png" type="image/png">
  </head>

  <body>
    <div class="loading"></div>
    <div class="offline-message" id="offline-message"></div>
    <div class="content-show">
      <!--Header-->
      <header></header>

      <!-- user -->
      <div class="container user-header">
        <div class="left">
          <div class="left_header">
            <div class="grid">
              <div class="image-preview" id="image-preview"></div>
              <p id="name">Thảo Phương</p>
            </div> 
          </div>
          <div class="lef-content">
            <div class="list">
              <i class="fa-regular fa-user"></i>
              <p>Tài Khoản Của Tôi</p>
            </div>
            <ul class="list-ul">
              <li>Hồ sơ</li>
              <li>Ngân Hàng</li>
              <li>Địa chỉ</li>
              <li>Đổi mật khẩu</li>
              <li>Cài Đặt Thông Báo</li>
            </ul>
            <div class="list">
              <i class="fa-regular fa-calendar"></i>
              <p>Đơn mua</p>
            </div>
            <div class="list">
              <i class="fa-regular fa-bell"></i>
              <p>Thông báo</p>
            </div>
            <div class="list">
              <i class="fa-solid fa-tag"></i>
              <p>Kho Voucher</p>
            </div>
          </div>
        </div>
        <div class="right">
          <div class="right-header">
            <h3>Thông tin cá nhân</h3>
            <p>Quản lý thông tin hồ sơ để bảo mật tài khoản</p>
          </div>
          <div class="right-content">
            <div class="right-text">
              <table>
                <tr>
                  <td>Số diện thoại</td>
                  <td>0123456789</td>
                </tr>
                <tr>
                  <td>Giới tính</td>
                  <td>
                    <input type="radio" name="gioitinh" id="nam" checked />
                    <label for="nam">Nam</label>
                    <input type="radio" name="gioitinh" id="nu" />
                    <label for="nu">Nữ</label>
                  </td>
                </tr>
                <tr>
                  <td>Ngày sinh</td>
                  <td>
                    <select id="day" name="day"></select>
                    <select id="month" name="month"></select>
                    <select id="year" name="year"></select>
                  </td>
                </tr>
              </table>
            </div>
            <div class="right-img">
              <form action="">
                <img src="" alt="" width="200" height="200" id="imgFile" />
                <input
                  type="file"
                  name=""
                  id="imageFile"
                  onchange="chooseFile(this)"
                  accept="image/*"
                  style="display: none"
                />
                <label for="imageFile">Choose Image</label>
              </form>
            </div>
          </div>
        </div>
      </div>
      <!--Footer-->
      <footer></footer>
    </div>
    <script src="../assets/js/loading&connect.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="../assets/js/header&footer.js"></script>
    <script src="../assets/js/user-info.js"></script>
  </body>
</html>
