<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tarot Enigma</title>
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link rel="stylesheet" href="../assets/css/dangkydangnhap.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />
    <!--Favicon-->
    <link rel="icon" href="../assets/images/Giới thiệu/favicon-01.png" type="image/png">
  </head>
  <body>
    <div class="offline-message" id="offline-message"></div>
    <header></header>
    <div class="register-form">
      <div class="register-header">
        <h1>ĐĂNG KÝ</h1>
      </div>
      <form id="register-form">
        <div class="input-group">
          <p id="name-label">Tên<span style="color:red">*</span></label><br>
          <input type="text" id="name" name="name" required>
        </div>
        <div class="input-group">
          <p id="surname-label">Họ<span style="color:red">*</span></label><br>
          <input type="text" id="surname" name="surname" required>
        </div>
        <div class="input-group">
          <p id="email-label">Email<span style="color:red">*</span></label><br>
          <input type="email" id="email" name="email" required>
        </div>
        <div class="input-group">
          <p id="password-label">Mật khẩu<span style="color:red">*</span></label><br>
          <input type="password" id="password" name="password" required>
        </div>
        <div class="input-group">
          <p id="confirm-password-label">Xác nhận mật khẩu<span style="color:red">*</span></label><br>
          <input type="password" id="confirm-password" name="confirm-password" required>
        </div>
        <div class="input-group">
          <div class="input-group1">
            <a>Bạn đã có một tài khoản?</a>
            <span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>
            <a class="link" href="../template/dangnhap.html">Đăng nhập</a>
            <span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>
          </div>
          <button type="submit" id="submit-button">
            <a class="link submit-button" href="../template/user-info.html">TẠO TÀI KHOẢN</a>
          </button>
        </div>
      </form>
    </div> 
    <footer></footer>
    <script src="../assets/js/loading&connect.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="../assets/js/header&footer.js"></script>
  </body>
</html>
