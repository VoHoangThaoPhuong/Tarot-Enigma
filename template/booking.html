<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Make My Home</title>
    <!--General-->
    <link rel="stylesheet" href="../assets/css/style.css" />
    <!-- Thietkethicong -->
    <link rel="stylesheet" href="../assets/css/booking.css" />
    <!--Boostrap-->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <!--Fontawsome-->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />
  </head>

  <body>
    <div class="loading"></div>
    <div class="offline-message" id="offline-message"></div>
    <div class="content-show">
      <!--Header-->
      <header></header>

          <!-- slide_show -->
          <div
            id="carouselExampleCaptions"
            class="carousel slide"
            data-bs-ride="carousel"
          >
            <div class="carousel-indicators">
              <button
                type="button"
                data-bs-target="#carouselExampleCaptions"
                data-bs-slide-to="0"
                class="active"
                aria-current="true"
                aria-label="Slide 1"
              ></button>
              <button
                type="button"
                data-bs-target="#carouselExampleCaptions"
                data-bs-slide-to="1"
                aria-label="Slide 2"
              ></button>
            </div>
            <div class="carousel-inner">
              <div class="carousel-item active" data-bs-interval="10000">
                <img
                  src="../assets/images/thietkethicong/slide_show1.jpg"
                  class="d-block w-100"
                  alt="..."
                />
                <div class="carousel-caption d-none d-md-block"></div>
              </div>
              <div class="carousel-item" data-bs-interval="10000">
                <img
                  src="../assets/images/thietkethicong/slide_show2.jpg"
                  class="d-block w-100"
                  alt="..."
                />
                <div class="carousel-caption d-none d-md-block"></div>
              </div>
            </div>
            <button
              class="carousel-control-prev"
              type="button"
              data-bs-target="#carouselExampleCaptions"
              data-bs-slide="prev"
            >
              <span
                class="carousel-control-prev-icon"
                aria-hidden="true"
              ></span>
              <span class="visually-hidden">Previous</span>
            </button>
            <button
              class="carousel-control-next"
              type="button"
              data-bs-target="#carouselExampleCaptions"
              data-bs-slide="next"
            >
              <span
                class="carousel-control-next-icon"
                aria-hidden="true"
              ></span>
              <span class="visually-hidden">Next</span>
            </button>
          </div>

          <!-- Dăng ký -->
          <div class="sign">
            <div class="sign-image"></div>
            <div class="sign-form">
              <div class="sign-form_text">
                <h3>ĐĂNG KÝ TƯ VẤN TẠI NHÀ</h3>
                <p>
                  Hẹn gặp ngay tư vấn thiết kế nội thất tại nhà bằng cách để lại
                  thông tin tại form dưới đây
                </p>
                <p><span>Tên của bạn (Yêu cầu)</span></p>
                <input type="text" name="your-name" id="" />
                <p><span>Điện thoại (Yêu cầu)</span></p>
                <input type="text" name="" id="" />
                <p><span>Email của bạn</span></p>
                <input type="email" name="" id="" />
                <p><span>Địa chỉ</span></p>
                <input type="text" name="" id="" />
                <p><span>Yêu cầu của bạn (Yêu cầu)</span></p>
                <textarea name="" id="" cols="50" rows="6"></textarea>
                <div class="sign-button">
                  <label class="label">
                    <input type="file" required />
                  </label>
                  <button class="other_button lienhe">GỬI YÊU CẦU</button>
                  <button class="lienhe">LIÊN HỆ: 18007200</button>
                </div>
              </div>
            </div>
          </div>
          <hr />
          <div class="thietke_header-container">

      <!--Footer-->
      <footer></footer>
    </div>
    <script src="../assets/js/loading&connect.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
    <script src="../assets/js/thietkethicong.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="../assets/js/header&footer.js"></script>
    <script src="../assets/js/slideshow.js"></script>
  </body>
</html>
