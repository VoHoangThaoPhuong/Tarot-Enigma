<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Make My Home</title>
    <!--General-->
    <link rel="stylesheet" href="../assets/css/style.css" />
    <!-- Booking -->
    <link rel="stylesheet" href="../assets/css/booking.css" />
    <link rel="stylesheet" href="../assets/css/header.css" />
    <!--Boostrap-->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <!--Fontawsome-->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />
  </head>

  <body>
    <div class="loading"></div>
    <div class="offline-message" id="offline-message"></div>
    <div class="content-show">
      <!--Header-->
      <header></header>
          <!-- slide_show -->
          <div id="carouselExampleCaptions" class="carousel slide" data-bs-ride="carousel">
            <div class="carousel-indicators">
              <button
                type="button"
                data-bs-target="#carouselExampleCaptions"
                data-bs-slide-to="0"
                class="active"
                aria-current="true"
                aria-label="Slide 1"
              ></button>
              <button
                type="button"
                data-bs-target="#carouselExampleCaptions"
                data-bs-slide-to="1"
                aria-label="Slide 2"
              ></button>
            </div>
            <div class="carousel-inner">
              <div class="carousel-item active" data-bs-interval="10000">
                <img
                  src="../assets/images/Booking/Header 1.jpeg"
                  class="d-block w-100"
                  alt="..."
                />
                <div class="carousel-caption d-none d-md-block"></div>
              </div>
              <div class="carousel-item" data-bs-interval="10000">
                <img
                  src="../assets/images/Booking/Header2.jpeg"
                  class="d-block w-100"
                  alt="..."
                />
                <div class="carousel-caption d-none d-md-block"></div>
              </div>
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide="prev">
              <span
                class="carousel-control-prev-icon"
                aria-hidden="true"
              ></span>
              <span class="visually-hidden">Previous</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide="next">
              <span
                class="carousel-control-next-icon"
                aria-hidden="true"
              ></span>
              <span class="visually-hidden">Next</span>
            </button>
          </div>
          <!-- Booking -->
          <div class="sign">
            <img src="../assets/images/Booking/Background.jpeg" alt="Loi anh" class="sign-image">
            <div class="sign-form">
              <div class="sign-form_text">
                <h3>BOOKING TAROT READER</h3>
                <p>
                  Đặt lịch Tarot Reader ngay tại đây!
                </p>
                <p><span>Bạn muốn xem về chủ đề gì?</span></p>
                <select type="text" name="topic" id="">
                  <option value="op1" selected="selected" >Chọn chủ đề</option>
                  <option value="op2">Tình cảm</option>
                  <option value="op3">Học tập, sự nghiệp</option>
                  <option value="op4">Các mối quan hệ khác</option>
                </select>
                <p><span>Bạn muốn xem gói nào?</span></p>
                <select type="text" name="" id="">
                  <option value="op1" selected="selected" >Chọn gói</option>
                  <option value="op2">3 câu hỏi</option>
                  <option value="op3">5 câu hỏi</option>
                  <option value="op4">Không giới hạn câu hỏi trong 30 phút</option>
                  <option value="op5">Không giới hạn câu hỏi trong 1 tiếng</option>
                </select>
                <p><span>Chọn Tarot Reader bạn muốn xem cùng:</span></p>
                <select type="text" name="" id="">
                  <option value="op1" selected="selected" >Chọn Tarot Reader</option>
                  <option value="op2">Võ Hoàng Thảo Phương - 3 năm kinh nghiệm</option>
                  <option value="op3">Đỗ Lương Phương Sang - 1 năm kinh nghiệm</option>
                  <option value="op4">Anna Marie - 1 năm kinh nghiệm</option>
                  <option value="op5">Khu vườn nhỏ của Andy - 5 năm kinh nghiệm</option>
                </select>
                <p><span>Chọn hình thức xem:</span></p>
                <select type="text" name="" id="">
                  <option value="op1" selected="selected" >Chọn hình thức xem</option>
                  <option value="op2">Trực tiếp (sẽ lên lịch hẹn sau)</option>
                  <option value="op3">Trực tuyến</option>
                </select>
                <p><span>Yêu cầu của bạn (Yêu cầu)</span></p>
                <textarea name="" id="" cols="50" rows="6"></textarea>
                <div class="sign-button">
                  <button class="other_button ">GỬI YÊU CẦU BOOKING</button>
                  <button class="">LIÊN HỆ: 0123456789</button>
                </div>
              </div>
            </div>
          </div>
          <hr />
          <div class="thietke_header-container">

      <!--Footer-->
      <footer></footer>
    </div>
    <script src="../assets/js/loading&connect.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
    <script src="../assets/js/booking.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="../assets/js/header&footer.js"></script>
    <script src="../assets/js/slideshow.js"></script>
  </body>
</html>
